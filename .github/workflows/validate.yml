name: CI

# Runs Claude Code's own plugin validator over the marketplace and its plugin,
# strictly, plus the plugin directory's submission profile, then checks the
# manifests agree and the plugin connects only to CarrierNote's MCP server.
# Every file outside .github/, .prettierignore, CLAUDE.md and README.md is
# generated by CarrierNote's release tooling.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned: bump deliberately, in a PR, after checking the validator's notes.
  CLAUDE_CODE_VERSION: "2.1.322"
  PRETTIER_VERSION: "3.9.10"

jobs:
  format:
    name: Format and Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # No token left in .git/config: the steps below run code fetched from
      # npm, and nothing after the checkout needs git credentials.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22.12.0"

      # Prettier for everything but Markdown (.prettierignore).
      - name: Prettier
        run: npx --yes "prettier@${PRETTIER_VERSION}" --check .

      # Unpadded Markdown tables.
      - name: Markdown tables
        run: node .github/scripts/md-tables-check.mjs

  validate:
    name: Validate marketplace and plugins
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22.12.0"

      # Before the first release the repo holds no marketplace yet; the checks
      # below then pass with a notice, and apply in full from the first release.
      - name: Is there a marketplace yet?
        id: present
        run: |
          if [ -f .claude-plugin/marketplace.json ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No marketplace yet (.claude-plugin/marketplace.json); nothing to validate before the first release."
            echo "yes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Claude Code (validator only, no sign-in)
        if: steps.present.outputs.yes == 'true'
        run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Marketplace manifest
        if: steps.present.outputs.yes == 'true'
        run: claude plugin validate --strict .

      - name: The plugin (strict + directory profile)
        if: steps.present.outputs.yes == 'true'
        run: claude plugin validate --strict --profile directory plugins/carriernote

      # Runs with or without a marketplace: it also checks the rest of the
      # repository names no other server.
      - name: Manifests agree, one plugin, one server
        run: node .github/scripts/check-manifests.mjs
